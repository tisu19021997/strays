<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PETS</title>
<style>
  /*
   * Nothing-style: monochrome, typographic, industrial. Structure is the
   * ornament — the grid and the hierarchy are meant to be visible.
   *
   * Three layers and no more. Display (the title), body (pet names), metadata
   * (mono ALL CAPS labels). Squint at it and the ordering is still the thing you
   * see, which is the whole job of this window.
   *
   * Red is an interrupt, never a default: the only thing allowed to use it is an
   * empty lane, because that is the one state here that is actually wrong. A
   * checked toggle is *not* an event, so it is grayscale.
   *
   * The fonts the system asks for are Space Grotesk, Space Mono and Doto, and they
   * are named first so a machine that has them uses them. They are not fetched.
   * strays makes exactly one network request in its life — a version check, off by
   * a switch — and that claim is worth more than a typeface. Everything else in
   * the system is structural and survives the substitution intact.
   */
  :root {
    --black: #000000;
    --surface: #111111;
    --surface-raised: #1A1A1A;
    --border: #222222;
    --border-visible: #333333;
    --text-disabled: #666666;
    --text-secondary: #999999;
    --text-primary: #E8E8E8;
    --text-display: #FFFFFF;
    --accent: #D71921;

    --mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --display: "Doto", var(--mono);

    /* subtle ease-out, no spring, no bounce */
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  /*
   * Light mode is not derived. It is a warm off-white ground with its own
   * contrast decisions, given the same attention as the OLED black.
   */
  @media (prefers-color-scheme: light) {
    :root {
      --black: #F5F5F5;
      --surface: #FFFFFF;
      --surface-raised: #F0F0F0;
      --border: #E8E8E8;
      --border-visible: #CCCCCC;
      --text-disabled: #999999;
      --text-secondary: #666666;
      --text-primary: #1A1A1A;
      --text-display: #000000;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--black); color: var(--text-primary);
    font: 400 14px/1.5 var(--sans);
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }

  /* the dot-matrix motif: background only, and never as a border or a control */
  #grid {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.14;
    background-image: radial-gradient(var(--text-disabled) 1px, transparent 1px);
    background-size: 16px 16px;
  }

  /* ---------------------------------------------------------------- layer 1 */
  header { padding: 24px 24px 16px; }
  h1 {
    margin: 0; font-family: var(--display);
    font-size: 36px; line-height: 1.1; letter-spacing: -0.02em;
    font-weight: 700; color: var(--text-display);
  }
  header p {
    margin: 8px 0 0; font-size: 14px; line-height: 1.5;
    color: var(--text-secondary); max-width: 34ch;
  }

  /* ---------------------------------------------------------------- layer 3 */
  .label {
    font-family: var(--mono); font-size: 11px; line-height: 1.2;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  #list { flex: 1; overflow-y: auto; padding: 16px 24px 24px; }

  /*
   * A row is a technical container: 1px border, no radius, no shadow. Rows sit
   * flush so the list reads as one instrument rather than five floating cards.
   */
  .row {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 10px 12px;
    transition: border-color 150ms var(--ease), opacity 150ms var(--ease);
  }
  .row:last-child { border-bottom: 1px solid var(--border); }
  .row.dragging { opacity: 0.3; }
  .row.over { border-color: var(--text-display); }
  .row.off { opacity: 0.45; }

  /* the handle is the only thing that starts a drag, so a press on the toggle
     never turns into an accidental reorder */
  .grip {
    cursor: grab; color: var(--text-disabled); flex: none;
    font-family: var(--mono); font-size: 13px; line-height: 1;
    padding: 2px 2px 2px 0; letter-spacing: -1px;
  }
  .grip:active { cursor: grabbing; }

  .seat { width: 44px; height: 40px; flex: none; display: flex; align-items: flex-end; justify-content: center; }
  .sprite { image-rendering: pixelated; }

  .who { flex: 1; min-width: 0; }
  .name {
    font-size: 16px; font-weight: 500; color: var(--text-display);
    display: flex; align-items: center; gap: 8px;
  }
  .badge {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--text-secondary);
    border: 1px solid var(--border-visible);
    border-radius: 2px; padding: 0 4px;
  }
  .slot { color: var(--text-secondary); margin-top: 2px; }
  .row.off .slot { color: var(--text-disabled); }

  /*
   * A mechanical toggle rather than a tick: a bored square that fills. Grayscale,
   * because a pet being switched on is not an event — nothing here is urgent
   * enough to earn the red.
   */
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 18px; height: 18px; cursor: pointer;
    background: transparent;
    border: 1px solid var(--border-visible);
    border-radius: 2px;
    display: grid; place-content: center;
    transition: border-color 150ms var(--ease);
  }
  input[type=checkbox]::after {
    content: ''; width: 8px; height: 8px;
    background: var(--text-display);
    opacity: 0;
    transition: opacity 150ms var(--ease);
  }
  input[type=checkbox]:checked { border-color: var(--text-display); }
  input[type=checkbox]:checked::after { opacity: 1; }
  input[type=checkbox]:focus-visible { outline: 1px solid var(--text-display); outline-offset: 2px; }

  /* the one interrupt: an empty lane is the only state here that is wrong */
  #empty {
    margin: 16px 0 0; padding: 8px 10px;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  #empty[hidden] { display: none; }

  /* ---------------------------------------------------------------- the lane */
  footer { border-top: 1px solid var(--border); padding: 16px 24px 24px; }
  footer h2 { margin: 0 0 12px; color: var(--text-disabled); font-weight: 400; }
  .opt { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .opt label { flex: 1; color: var(--text-primary); cursor: pointer; }

  button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 700;
    color: var(--text-primary); background: var(--surface-raised);
    border: 1px solid var(--border-visible); border-radius: 4px;
    padding: 5px 12px; cursor: pointer;
    transition: border-color 150ms var(--ease), color 150ms var(--ease);
  }
  /* hover brightens the border and the text. It does not scale or cast a shadow. */
  button:hover { border-color: var(--text-display); color: var(--text-display); }
</style>
</head>
<body>
  <div id="grid"></div>

  <header>
    <h1>PETS</h1>
    <p>Order decides who takes which session. Top of the list goes out first.</p>
  </header>

  <div id="list"></div>
  <div id="empty" class="label" hidden>[ NO PETS OUT — THE LANE IS EMPTY ]</div>

  <footer>
    <h2 class="label">Lane</h2>
    <div class="opt">
      <input type="checkbox" id="follow">
      <label for="follow">Follow Claude Code sessions</label>
    </div>
    <div class="opt">
      <input type="checkbox" id="titles">
      <label for="titles">Session names on pets</label>
    </div>
    <div class="opt">
      <input type="checkbox" id="mischief">
      <label for="mischief">Heisenbug wanders when you leave</label>
    </div>
    <div class="opt">
      <input type="checkbox" id="party">
      <label for="party">Party mode</label>
      <button id="celebrate">Celebrate</button>
    </div>
  </footer>

  <script src="../strays.js"></script>
  <script src="pets-window.js"></script>
</body>
</html>
