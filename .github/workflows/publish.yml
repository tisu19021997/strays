# Publish to npm.
#
# One way in: release.yml calls this. It is deliberately not triggered by the tag
# it publishes, because a tag pushed with GITHUB_TOKEN does not trigger another
# workflow — relying on the tag would mean releases that tag themselves and never
# publish, silently. So the caller passes the tag in and this file checks it
# agrees with package.json before anything reaches the registry.
#
# **This file cannot be an entry point, and that is npm's rule rather than a
# choice.** Trusted publishing matches the OIDC `workflow_ref` claim, which names
# the workflow that *started the run* — not the file the running job lives in
# (`job_workflow_ref`). The trusted publisher for claude-strays is registered
# against release.yml, so a run that starts here has the wrong identity and npm
# answers `404 Not Found - PUT` — an error that says nothing whatsoever about
# OIDC and reads exactly like a missing package or a typo'd name.
#
# That is not hypothetical: this workflow used to carry `push: tags` and its own
# `workflow_dispatch`, the publisher was registered against publish.yml, and so
# every *manual* publish worked while the automatic one 404'd on every release.
# It went unnoticed because the release job still tagged, and the tag is the part
# people look at. To publish a tag that already exists, see `publish_tag` in
# release.yml.
name: publish

on:
  workflow_call:
    inputs:
      ref:
        description: the tag to publish; defaults to whatever triggered the run
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance, and trusted publishing if it is set up
    steps:
      # Fail here, with the reason, rather than at `npm publish` with a 404 that
      # names neither OIDC nor the workflow. Costs one step and no network.
      - name: The entry workflow has to be the one npm trusts
        env:
          ENTRY: ${{ github.workflow_ref }}
          JOB: ${{ github.job_workflow_ref }}
        run: |
          echo "entry workflow (what npm matches): $ENTRY"
          echo "this job's workflow:               $JOB"
          case "$ENTRY" in
            */release.yml@*) echo "ok — the trusted publisher is registered for release.yml" ;;
            *)
              echo
              echo "This run did not start from release.yml, so npm's trusted"
              echo "publisher will not match it and the publish would fail with a"
              echo "bare '404 Not Found - PUT'. npm matches workflow_ref, which is"
              echo "the workflow that started the run, not the file this job is in."
              echo
              echo "To publish a tag that already exists:"
              echo "  gh workflow run release.yml -f publish_tag=vX.Y.Z"
              exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          # a called workflow otherwise checks out the commit that triggered the
          # *caller*, which is the one before the version bump — it would test
          # the new version and publish the old one
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          # 24 bundles npm 11.x, which is the floor trusted publishing needs —
          # but only from 11.5.1, and early 24.x releases shipped 11.3. The step
          # below makes that certain rather than assumed.
          node-version: 24
          # npm's own trusted-publishing instructions include this, and leaving
          # it out is the difference between npm resolving auth for the registry
          # it is about to publish to and not looking for any
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1. Which npm a Node release
      # bundles is not something to guess at: below the floor the publish fails
      # with an authentication error that says nothing about the real cause, and
      # the obvious conclusion — that the trusted publisher is set up wrong — is
      # the wrong one. `sort -V` compares versions properly, so 11.10 counts as
      # above 11.5.1 rather than below it.
      - name: An npm that can use trusted publishing
        run: |
          node -v && npm -v
          need=11.5.1
          have="$(npm -v)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have is below $need — upgrading"
            npm install -g npm@latest
            npm -v
          fi

      # no install: the suite is dependency-free. See ci.yml.
      - name: Test
        run: npm test

      - name: The tag and the version must agree
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          want="${TAG##*/}"; want="${want#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag says $want, package.json says $have"
            exit 1
          fi
          echo "publishing $have"

      - name: What would ship
        run: npm pack --dry-run

      # `files` in package.json is a whitelist, so anything left out of it is
      # simply missing for everyone who installs from npm while working
      # perfectly in the checkout it was tested in
      - name: Everything the command needs is in the tarball
        run: |
          npm pack --json > /tmp/pack.json
          for f in bin/strays.js strays.js desktop/main.js desktop/package.json; do
            node -e '
              const need = process.argv[1];
              const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
              if (!files.includes(need)) {
                console.error("missing from the tarball: " + need);
                process.exit(1);
              }
              console.log("ok " + need);
            ' "$f"
          done

      # Trusted publishing failed once with a bare ENEEDAUTH and no mention of
      # OIDC at all — npm had not attempted the exchange, and nothing in the log
      # said why, so the cause was indistinguishable between "the token request
      # was not granted" and "the registry rejected it". These two lines tell
      # those apart without printing anything secret: the URL is not a
      # credential, and only its presence is reported.
      - name: Can this job even ask for an OIDC token?
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "yes: id-token: write is in force, so OIDC is available"
          else
            echo "NO: no OIDC token request URL in this job."
            echo "id-token: write is not in force here — for a called workflow it"
            echo "has to be granted by the caller as well as by this file."
          fi

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "authenticating with the NPM_TOKEN secret"
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "no NPM_TOKEN secret — relying on trusted publishing (OIDC)."
            echo "That needs a trusted publisher registered for this package on"
            echo "npmjs.com naming this repo and .github/workflows/publish.yml."
          fi
          npm publish --provenance --access public
