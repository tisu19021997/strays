# Work the next version out from the commits, tag it, and publish it.
#
# The bump comes from Conventional Commits since the last v* tag:
#
#   feat!: … , or BREAKING CHANGE in a body   major
#   feat: …                                   minor
#   fix: … , perf: …                          patch
#   anything else (docs, chore, test, …)      no release at all
#
# That last line is the important one. Every push to main running a release
# would mean a version of the package for every typo fixed in the README, so a
# commit that changes nothing anyone installs releases nothing.
#
# Run it by hand from the Actions tab to force a particular bump, or to cut the
# first release of a version the rules would have skipped.
#
# **This is the only way anything reaches npm**, and that is npm's rule rather
# than a preference: trusted publishing matches the OIDC `workflow_ref` claim,
# which names the workflow that started the run, so the publisher registered for
# claude-strays names *this* file. publish.yml is `workflow_call` only — see the
# note at the top of it, and `publish_tag` below for a tag that already exists.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: which part to bump; auto reads the commits
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      # A tag can only trigger its own push once, and publish.yml can no longer
      # be dispatched on its own, so this is the way back from a publish that
      # failed for a reason outside the package — a registry outage, an expired
      # credential, a fault in the workflow. It is also what finishes a hand-cut
      # `npm version patch && git push --follow-tags`, because the release job
      # below deliberately skips a head commit that is itself a release.
      publish_tag:
        description: publish an existing tag instead of bumping, e.g. v1.5.0
        required: false
        type: string
        default: ''

# a second push while a release is mid-flight would race it to the tag
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # the version commit and its tag
  id-token: write   # passed down to publish.yml for provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # publishing an existing tag skips the bump entirely: there is nothing to
    # work out and nothing to commit
    if: inputs.publish_tag == ''
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history and every tag, to read the commits

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # nothing is tagged, let alone published, until the suite is green
      - name: Test
        run: npm test

      - name: Work out the next version
        id: bump
        env:
          FORCED: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # its own release commit, if this ever runs with a token that
          # retriggers workflows. GITHUB_TOKEN deliberately does not.
          case "$(git log -1 --format='%s')" in
            'chore(release):'*)
              echo "the head commit is a release; nothing to do"
              exit 0 ;;
          esac

          last="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          range="HEAD"
          [ -n "$last" ] && range="$last..HEAD"
          echo "reading $range (last tag: ${last:-none})"

          subjects="$(git log --format='%s' "$range")"
          bodies="$(git log --format='%B' "$range")"

          bump=""
          if printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            bump=major
          # the footer belongs at column 0 and the spec allows the hyphen; both
          # are tolerated because the cost of missing one is a major release
          # quietly going out as a minor
          elif printf '%s\n' "$bodies" | grep -Eq '^[[:space:]]*BREAKING[ -]CHANGE'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$subjects" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          fi

          if [ -n "${FORCED:-}" ] && [ "${FORCED:-}" != "auto" ]; then
            echo "asked for a $FORCED bump by hand (the commits said: ${bump:-none})"
            bump="$FORCED"
          fi

          if [ -z "$bump" ]; then
            echo "nothing user-facing since ${last:-the beginning} — no release"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag="$(npm version "$bump" -m 'chore(release): v%s [skip ci]')"
          echo "$bump -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push the version commit and its tag
        if: steps.bump.outputs.tag != ''
        run: git push --follow-tags origin "HEAD:${{ github.ref_name }}"

  # Called, not left to the tag above: a tag pushed with GITHUB_TOKEN does not
  # trigger another workflow, so a release would tag itself and never publish.
  #
  # Calling it also keeps the OIDC identity right. The claim npm matches is the
  # *entry* workflow, so a job that lives in publish.yml but was started from here
  # publishes as release.yml, which is what the trusted publisher is registered
  # for. Turning this into a tag-triggered run of publish.yml is what broke it
  # before.
  #
  # `always()` because the bump job is skipped outright when publishing an
  # existing tag; the conditions below are what keep a *failed* bump from
  # publishing anyway.
  publish:
    needs: release
    if: >-
      always() && (
        inputs.publish_tag != '' ||
        (needs.release.result == 'success' && needs.release.outputs.tag != '')
      )
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release.outputs.tag }}
    secrets: inherit

  # The .dmg for people who have no Node, built alongside the package for people
  # who have. Deliberately not `needs: publish` — the two are independent, and a
  # registry problem should not also cost the download.
  #
  # No `always()` here on purpose: publishing an existing tag skips the bump, so
  # this is skipped too, which is right — that tag's .dmg was built when it was
  # cut and rebuilding it would replace a released asset.
  app:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/app.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
